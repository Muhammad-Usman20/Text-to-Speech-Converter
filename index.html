<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Voice Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔊 Text to Voice Converter</h1>

    <textarea id="text" placeholder="Type or paste text here..."></textarea>

    <div class="controls">
      <label for="voiceSelect">🎤 Voice</label>
      <select id="voiceSelect"></select>

      <label for="rate">⚡ Speed</label>
      <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
      <span id="rateValue">1.0</span>

      <label for="pitch">🎵 Pitch</label>
      <input type="range" id="pitch" min="0" max="2" value="1" step="0.1">
      <span id="pitchValue">1.0</span>

      <div class="buttons">
        <button id="speakBtn">▶️ Speak</button>
        <button id="pauseBtn">⏸️ Pause</button>
        <!-- <button id="resumeBtn">⏯️ Resume</button>
        <button id="stopBtn">⏹️ Stop</button> -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
